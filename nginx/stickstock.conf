# Reverse proxy for stickstock.lol.
#
# First deploy (before certificates exist): comment out the "server {
# listen 443 ...}" block below and the redirect in the :80 block, then run
# certbot in webroot mode (see README "SSL" section) to obtain certs. Once
# /etc/letsencrypt/live/stickstock.lol/ exists, uncomment everything.

server {
    listen 80;
    server_name stickstock.lol www.stickstock.lol;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name stickstock.lol www.stickstock.lol;

    ssl_certificate     /etc/letsencrypt/live/stickstock.lol/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stickstock.lol/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m; # allow CSV/Excel uploads for temp-table analysis

    # Go API — data sources, queries, dashboards, profile, exports.
    # (Auth itself goes straight from the frontend to Supabase, not through
    # this proxy — this API only verifies the JWT Supabase already issued.)
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket upgrade for live dashboard updates.
    location /ws/ {
        proxy_pass http://backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Next.js frontend. Everything not matched by /api/ or /ws/ above lands
    # here, including Next's own /_next/ static assets and /locales/*.json.
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
