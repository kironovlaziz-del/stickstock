services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      ANALYTICS_SERVICE_URL: http://analytics-service:8000
    networks: [internal]

  analytics-service:
    build: ./analytics-service
    restart: unless-stopped
    env_file: .env
    networks: [internal]
    environment:
      UPLOAD_DIR: /data/uploads

  semantic-layer:
    build: ./semantic-layer
    restart: unless-stopped
    networks: [internal]
    environment:
      DATABASE_URL: ${DATABASE_URL}

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    restart: unless-stopped
    networks: [internal]

  data-profiler:
    build: ./data-profiler
    restart: unless-stopped
    networks: [internal]

  ssh-tunnel-service:
    build: ./ssh-tunnel-service
    restart: unless-stopped
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/stickstock.conf:/etc/nginx/conf.d/default.conf:ro
      - /var/www/certbot:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on: [backend, frontend]
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [internal]
    volumes:
      - redis_data:/data

  metadata-service:
    build: ./metadata-service
    restart: unless-stopped
    networks: [internal]
    environment:
      METADATA_REDIS_URL: redis://redis:6379
    depends_on:
      - redis

networks:
  internal:

volumes:
  redis_data:
